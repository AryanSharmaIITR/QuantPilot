# =============================================================================
# QuantPilot — central pipeline configuration
# -----------------------------------------------------------------------------
# Every stage (ingest -> preprocess -> train -> predict) reads from this file.
# Paths are resolved relative to the project root (the directory containing this
# file), so the pipeline behaves identically regardless of the working dir.
#
# Override the config location with the QUANTPILOT_CONFIG environment variable.
# =============================================================================

project:
  name: final_market_pipeline   # prefix used for all saved model artifacts
  seed: 42

# --- Data windows & sequence construction ------------------------------------
data:
  train_timeperiod: "3y"        # yfinance history window for training data
  predict_timeperiod: "2mo"     # history window used by the live prediction run
  sequence_length: 14           # lookback window fed to the transformers
  dim: 18                       # per-timestep feature dimension (do not change lightly)
  splits:
    train: 0.70                 # 0.00 -> 0.70 train
    val: 0.85                   # 0.70 -> 0.85 val, 0.85 -> 1.00 test

# --- Filesystem layout (relative to project root, auto-resolved to absolute) --
paths:
  # Training data
  raw_market: "data/raw/market_data"
  raw_stock: "data/raw/stock_data"
  preprocessed_market: "data/preprocessed/market_data"
  preprocessed_stock: "data/preprocessed/stock_data"
  # Live-prediction data (short window, no train/val/test split)
  predict_raw_market: "Data_For_Prediction/market_data"
  predict_raw_stock: "Data_For_Prediction/stock_data"
  predict_preprocessed_market: "Data_For_Prediction/preprocessed_market_data"
  predict_preprocessed_stock: "Data_For_Prediction/preprocessed_stock_data"
  # Outputs
  artifacts: "artifacts"
  predictions: "predictions.csv"

# --- Data ingestion (yfinance) -----------------------------------------------
ingestion:
  max_retries: 3                # retries per ticker on transient download errors
  retry_delay_seconds: 5        # base delay; backs off linearly per attempt

# --- Inference -----------------------------------------------------------------
inference:
  # Checkpoint consumed by the prediction run. The default is the combined NN
  # checkpoint produced by training (pretrain_nn / save) and is git-tracked.
  nn_checkpoint: "artifacts/final_market_pipeline_nn_model.pth"
  threshold: 0.5                # sigmoid threshold for the up/down decision

# --- Transformer pretraining (Phase 1) ---------------------------------------
transformer:
  d_model: 128
  nhead: 8
  num_layers: 3
  dim_feedforward: 256
  dropout: 0.1
  epochs: 300
  lr: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0

# --- NN surrogate pretraining (Phase 2) --------------------------------------
nn:
  epochs: 100
  lr: 1.0e-3
  batch_size: 32
  grad_clip: 1.0

# --- XGBoost (Phase 3) -------------------------------------------------------
xgboost:
  use_optuna: false
  optuna_trials: 50
  cv_folds: 5
  params:
    max_depth: 6
    learning_rate: 0.05
    n_estimators: 300
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
    seed: 42

# --- Agentic investment advisor (LangGraph) ----------------------------------
# Reads predictions.csv + Tavily news and drafts three allocation plans for a
# user-supplied budget. Keys are read from the environment (or a .env file at the
# project root): GROQ_API_KEY / GOOGLE_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY
# for the LLM, and TAVILY_API_KEY for news. Everything degrades gracefully.
agent:
  currency: "INR"               # display currency for plan allocations
  llm:
    provider: groq              # groq | gemini | openai | anthropic
    model: openai/gpt-oss-120b   # groq-hosted; gemini e.g. gemini-2.0-flash
    temperature: 0.3
    max_tokens: 3000            # output budget — keep input+output under Groq free-tier TPM
  # Intraday trade levels (take-profit / stop-loss as % of the entry price),
  # per plan. Computed in code from the live price — target = exit-to-book-profit,
  # stoploss = exit-to-cut-loss (the "sell threshold").
  trade:
    aggressive:   { target_pct: 4.0, stoploss_pct: 2.0 }
    conservative: { target_pct: 1.5, stoploss_pct: 1.0 }
    optimal:      { target_pct: 2.5, stoploss_pct: 1.5 }
  news:
    enabled: true               # master switch for Tavily news enrichment
    per_stock_results: 2        # top news items fetched per stock (shown in UI)
    market_results: 5           # top news items for the broad Indian market
    max_stocks: 15              # cap stocks fetched news for (top-N by probability; 0 = every stock)
    # Prompt-size controls — the LLM prompt is trimmed independently of what the
    # UI shows, so free-tier token limits (Groq gpt-oss-120b ~8k TPM) aren't exceeded:
    prompt_max_signals: 25      # top-N signals (with live + prob) fed to the LLM (0 = all)
    prompt_max_stocks: 8        # only the top-N signals' news go into the prompt (0 = all)
    prompt_snippet_chars: 160   # per-news characters fed to the LLM

# --- Logging ------------------------------------------------------------------
logging:
  level: INFO                   # DEBUG | INFO | WARNING | ERROR
